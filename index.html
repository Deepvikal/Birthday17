<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>For Vaishnavi ♡</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,sans-serif}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:12px;background:#151015}
.phone{width:min(440px,100%);min-height:680px;position:relative;overflow:hidden;border-radius:32px;color:#fff;background:linear-gradient(180deg,#0003,#000b),url("images/background.jpg") center/cover no-repeat;box-shadow:0 20px 70px #0007}
.content{position:relative;z-index:2;padding:24px 18px 18px;min-height:680px}.top{display:flex;justify-content:space-between;align-items:flex-start}
.hello{font-size:12px;opacity:.8}.name{font-size:25px;font-weight:800}.mute{border:1px solid #ffffff4d;background:#0004;color:#fff;border-radius:50%;width:44px;height:44px;font-size:18px;cursor:pointer}
.center{text-align:center;margin:38px 0 30px}.center h1{font-size:31px;margin:0 0 8px;text-shadow:0 3px 15px #0008}.center p{font-size:13px;opacity:.85}
.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.app{border:1px solid #ffffff38;background:#ffffff24;color:#fff;border-radius:22px;padding:15px 7px;min-height:106px;cursor:pointer;backdrop-filter:blur(10px);transition:.18s}.app:hover{transform:translateY(-3px)}.app:active{transform:scale(.94)}
.icon{font-size:28px;margin-bottom:8px}.app span{font-size:12px;font-weight:700}.bottom{position:absolute;left:18px;right:18px;bottom:18px;text-align:center;font-size:12px;opacity:.75}
.modal{position:absolute;inset:0;background:#0a070ab8;z-index:10;display:none;align-items:flex-end;padding:10px}.modal.show{display:flex}.sheet{width:100%;max-height:88%;overflow:auto;background:#fffafd;color:#241c22;border-radius:28px;padding:22px;animation:up .25s ease}
@keyframes up{from{transform:translateY(35px);opacity:0}to{transform:translateY(0);opacity:1}}.close,.photo-close{border:0;background:#f2e5ec;color:#241c22;border-radius:50%;width:40px;height:40px;font-size:20px;cursor:pointer}.close{float:right}h2{font-size:25px;margin:3px 45px 7px 0}.sub{color:#8b7680;font-size:13px}.note{background:#fff0f6;border-radius:20px;padding:18px;margin-top:17px;line-height:1.75;font-size:15px}
.songs{display:grid;gap:11px;margin-top:18px}.song{background:#241e23;color:#fff;border-radius:18px;padding:15px}.song strong{display:block}.song small{color:#cbbfc6}.song audio{width:100%;margin-top:10px}
.memory-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:17px}.memory{border:0;padding:0;height:150px;border-radius:18px;overflow:hidden;cursor:pointer;background:#eee}.memory img{width:100%;height:100%;object-fit:cover;display:block;transition:.2s}.memory:hover img{transform:scale(1.04)}
.wish{text-align:center}.heart{font-size:50px;animation:pulse 1.4s infinite}@keyframes pulse{50%{transform:scale(1.12)}}
.photo-viewer{position:absolute;inset:0;background:#000eb;z-index:20;display:none;align-items:center;justify-content:center;padding:18px}.photo-viewer.show{display:flex}.photo-viewer img{max-width:100%;max-height:80%;object-fit:contain;border-radius:16px}.photo-close{position:absolute;top:18px;right:18px;background:#fff}
