@font-face{
  font-family:"MyFont";
  src:url("fonts/MyFont.ttf") format("truetype");

  font-style:normal;
  font-display:swap;
}

*{
  box-sizing:border-box;
  font-family:"MyFont",sans-serif;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:"MyFont",sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:12px;
  background:#151015;
}

.phone{
  width:min(440px,100%);
  min-height:680px;
  position:relative;
  overflow:hidden;
  border-radius:32px;
  color:#fff;

  background:
    linear-gradient(180deg,#0003,#000b),
    url("images/background.jpg") center/cover no-repeat;

  box-shadow:0 20px 70px #0007;
}


/* ==================================================
   FIRST OPEN MUSIC MESSAGE
   ================================================== */

.music-hint{
  position:absolute;
  top:16px;
  left:50%;
  transform:translateX(-50%);
  z-index:30;
  width:calc(100% - 90px);
  padding:10px 14px;
  text-align:center;
  font-size:12px;
  font-weight:700;
  color:#fff;
  background:#00000080;
  border:1px solid #ffffff35;
  border-radius:18px;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  box-shadow:
    0 5px 20px #0005,
    inset 0 1px 1px #ffffff20;
  animation:hintPulse 1.8s ease-in-out infinite;
}

@keyframes hintPulse{
  0%,100%{
    opacity:.75;
    transform:translateX(-50%) translateY(0);
  }
  50%{
    opacity:1;
    transform:translateX(-50%) translateY(3px);
  }
}

.music-hint.hide{
  opacity:0;
  pointer-events:none;
  transform:translateX(-50%) translateY(-10px);
  transition:.35s ease;
}


/* ==================================================
   GIF LAYER
   ================================================== */

.gif-layer{
  position:absolute;
  inset:0;
  overflow:hidden;
  z-index:1;
  pointer-events:none;
  touch-action:none;
}

.falling-gif{
  position:absolute;
  left:0;
  top:0;
  width:96px;
  height:96px;
  object-fit:contain;
  pointer-events:none;
  user-select:none;
  opacity:0;
  transform-origin:center center;
  will-change:transform;
  filter:drop-shadow(0 5px 10px #0008);
  border-radius:20px;
  overflow:hidden;
}


/* ==================================================
   I LOVE YOU MESSAGE
   ================================================== */

.love-message{
  position:absolute;
  z-index:5;
  pointer-events:none;
  user-select:none;
  white-space:nowrap;
  font-size:18px;
  font-weight:800;
  color:#fff;
  text-shadow:
    0 2px 10px #000,
    0 0 12px #ff8fc7;
  opacity:0;
  transform:translate(-50%,-50%) scale(.75);
  animation:lovePop 1.4s ease forwards;
}

@keyframes lovePop{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(.75);
  }
  15%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.08);
  }
  35%{
    transform:translate(-50%,-50%) scale(1);
  }
  100%{
    opacity:0;
    transform:translate(-50%,-110px) scale(1.05);
  }
}


/* ==================================================
   MAIN CONTENT
   ================================================== */

.content{
  position:relative;
  z-index:2;
  min-height:680px;
  padding:24px 18px 18px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.hello{
  font-size:12px;
  opacity:.8;
}

.name{
  font-size:25px;
  font-weight:800;
}

.mute{
  border:1px solid #ffffff4d;
  background:#0004;
  color:#fff;
  border-radius:50%;
  width:44px;
  height:44px;
  font-size:18px;
  cursor:pointer;
}

.center{
  text-align:center;
  margin:38px 0 30px;
}

.center h1{
  font-size:31px;
  margin:0 0 8px;
  text-shadow:0 3px 15px #0008;
}

.center p{
  font-size:13px;
  opacity:.85;
}


/* ==================================================
   APPS
   ================================================== */

.apps{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.app{
  position:relative;
  z-index:3;
  border:1px solid #ffffff38;
  background:#ffffff24;
  color:#fff;
  border-radius:22px;
  padding:15px 7px;
  min-height:106px;
  cursor:pointer;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  box-shadow:
    0 8px 25px #0004,
    inset 0 1px 1px #ffffff25;
  transition:.18s;
}

.app:hover{
  transform:translateY(-3px);
  background:#ffffff2b;
}

.app:active{
  transform:scale(.94);
  filter:blur(2px);
  background:#ffffff40;
}

.icon{
  font-size:28px;
  margin-bottom:8px;
}

.app span{
  font-size:12px;
  font-weight:700;
}

.bottom{
  position:absolute;
  left:18px;
  right:18px;
  bottom:18px;
  text-align:center;
  font-size:12px;
  opacity:.75;
}


/* ==================================================
   MODAL
   ================================================== */

.modal{
  position:absolute;
  inset:0;
  background:#00000055;
  backdrop-filter:blur(3px);
  -webkit-backdrop-filter:blur(3px);
  z-index:10;
  display:none;
  align-items:flex-end;
  padding:10px;
}

.modal.show{
  display:flex;
}

.sheet{
  width:100%;
  max-height:88%;
  overflow:auto;
  background:#ffffff20;
  color:#fff;
  border:1px solid #ffffff38;
  border-radius:28px;
  padding:22px;
  backdrop-filter:blur(20px) saturate(130%);
  -webkit-backdrop-filter:blur(20px) saturate(130%);
  box-shadow:
    0 10px 40px #0005,
    inset 0 1px 1px #ffffff35;
  animation:up .25s ease;
}

@keyframes up{
  from{
    transform:translateY(35px);
    opacity:0;
  }
  to{
    transform:translateY(0);
    opacity:1;
  }
}

.close,
.photo-close{
  border:0;
  background:#ffffffcc;
  color:#241c22;
  border-radius:50%;
  width:40px;
  height:40px;
  font-size:20px;
  cursor:pointer;
}

.close{
  float:right;
}

h2{
  font-size:25px;
  margin:3px 45px 7px 0;
  text-shadow:0 2px 10px #0006;
}

.sub{
  color:#ffffffc7;
  font-size:13px;
}


/* ==================================================
   NOTES
   ================================================== */

.note{
  background:#ffffff18;
  border:1px solid #ffffff25;
  color:#fff;
  border-radius:20px;
  padding:18px;
  margin-top:17px;
  line-height:1.75;
  font-size:15px;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  box-shadow:inset 0 1px 1px #ffffff20;
}


/* SECRET PAGE VIDEO */

.secret-video-frame{
  width:100%;
  margin:18px auto 0;
  padding:5px;
  border:2px solid #fff;
  border-radius:24px;
  background:#ffffff18;
  overflow:hidden;
  box-shadow:0 8px 24px #0005;
}

.secret-video{
  display:block;
  width:100%;
  max-height:350px;
  object-fit:contain;
  border-radius:16px;
  background:#000;
}


/* ==================================================
   SONGS
   ================================================== */

.songs{
  display:grid;
  gap:11px;
  margin-top:18px;
}

.song{
  background:#00000045;
  border:1px solid #ffffff25;
  color:#fff;
  border-radius:18px;
  padding:15px;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  box-shadow:inset 0 1px 1px #ffffff15;
}

.song strong{
  display:block;
}

.song small{
  color:#ffffffb5;
}

.song audio{
  width:100%;
  margin-top:10px;
}


/* ==================================================
   MEMORIES
   ================================================== */

.memory-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:17px;
}

.memory{
  border:1px solid #ffffff30;
  padding:0;
  height:150px;
  border-radius:18px;
  overflow:hidden;
  cursor:pointer;
  background:#ffffff18;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

.memory img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:.2s;
}

.memory:hover img{
  transform:scale(1.04);
}


/* ==================================================
   WISH
   ================================================== */

.wish{
  text-align:center;
}

.heart{
  font-size:50px;
  animation:pulse 1.4s infinite;
}

@keyframes pulse{
  50%{
    transform:scale(1.12);
  }
}


/* ==================================================
   PHOTO VIEWER
   ================================================== */

.photo-viewer{
  position:absolute;
  inset:0;
  background:#000eb;
  z-index:20;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.photo-viewer.show{
  display:flex;
}

.photo-viewer img{
  width:auto;
  height:auto;
  max-width:100%;
  max-height:80%;
  object-fit:contain;
  border-radius:16px;
}

.photo-close{
  position:absolute;
  top:18px;
  right:18px;
  background:#fff;
}


/* ==================================================
   I MISS YOU
   ================================================== */

.miss{
  position:fixed;
  transform:translate(-50%,-50%);
  z-index:50;
  pointer-events:none;
  font-weight:800;
  font-size:22px;
  color:#fff;
  text-shadow:0 3px 18px #000;
  animation:miss 1.35s ease forwards;
}

@keyframes miss{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(.8);
  }
  15%{
    opacity:1;
  }
  100%{
    opacity:0;
    transform:translate(-50%,-100%) scale(1.08);
  }
}


/* ==================================================
   MOBILE
   ================================================== */

@media(max-width:430px){

  .phone,
  .content{
    min-height:650px;
  }

  .center{
    margin-top:30px;
  }

  .app{
    min-height:96px;
  }

  .memory{
    height:125px;
  }

  .falling-gif{
    width:87px;
    height:87px;
    border-radius:18px;
  }

}

(function(){

"use strict";


/* ==================================================
   ELEMENTS
   ================================================== */

const phone =

const modal =

const bg =

const fallingGif =
  document.getElementById("fallingGif");

const musicHint =

/* ==================================================
   BACKGROUND MUSIC STATE
   ================================================== */

let muted = true;

let backgroundResumeAllowed = true;


/* ==================================================
   APP MEDIA CONTROL
   ================================================== */

function isAppMediaPlaying(){

  const media =
    content.querySelectorAll("audio, video");

  return Array.from(media).some(function(item){

    return !item.paused && !item.ended;

  });

}


function pauseBackgroundMusic(){

  bg.pause();

}


function resumeBackgroundMusic(){

  if(
    !muted &&
    backgroundResumeAllowed &&
    !isAppMediaPlaying()
  ){

    bg.play().catch(function(){});

  }

}


/* ==================================================
   GIF SYSTEM
   ================================================== */

const gifs = [

  "images/gif1.gif",
  "images/gif2.gif",
  "images/gif3.gif",
  "images/gif4.gif",
  "images/gif5.gif"

];


let currentGif = 0;

let x = 20;
let y = 20;

let vx = 1.8;
let vy = 2.2;

let angle = 0;
let spin = 3;

let lastTime = 0;

let gifRunning = true;


/* ==================================================
   GIF SIZE
   ================================================== */

function getGifSize(){

  return window.innerWidth <= 430
    ? 87
    : 96;

}


/* ==================================================
   RANDOM
   ================================================== */

function random(min,max){

  return Math.random() *
    (max-min) + min;

}


/* ==================================================
   I LOVE YOU MESSAGE
   ================================================== */

function showLoveMessage(){

  const message =
    document.createElement("div");

  message.className =
    "love-message";

  message.textContent =
    "I love you moti😙";


  message.style.left =
    (x + getGifSize()/2) + "px";

  message.style.top =
    (y + getGifSize()/2) + "px";


  document
    .getElementById("gifLayer")
    .appendChild(message);


  setTimeout(
    function(){

      message.remove();

    },
    1400
  );

}


/* ==================================================
   SHOW NEXT GIF
   ================================================== */

function showNextGif(){

  showLoveMessage();

  fallingGif.style.opacity =
    "0";

  fallingGif.src =
    gifs[currentGif];

  currentGif++;

  if(currentGif >= gifs.length){

    currentGif = 0;

  }

  spin =
    random(2,4);

  if(Math.random() < 0.5){

    spin *= -1;

  }

  fallingGif.onload =
    function(){

      fallingGif.style.opacity =
        "1";

    };

}


/* ==================================================
   GIF ANIMATION
   ================================================== */

function moveGif(time){

  if(!gifRunning){

    lastTime = time;

    requestAnimationFrame(
      moveGif
    );

    return;

  }


  if(time-lastTime < 33){

    requestAnimationFrame(
      moveGif
    );

    return;

  }


  lastTime = time;


  const size =
    getGifSize();


  const maxX =
    Math.max(
      0,
      phone.clientWidth-size
    );


  const maxY =
    Math.max(
      0,
      phone.clientHeight-size
    );


  x += vx;
  y += vy;


  if(x <= 0){

    x = 0;

    vx =
      Math.abs(vx);

  }


  if(x >= maxX){

    x = maxX;

    vx =
      -Math.abs(vx);

  }


  if(y <= 0){

    y = 0;

    vy =
      Math.abs(vy);

  }


  if(y >= maxY){

    y = maxY;

    vy =
      -Math.abs(vy);

  }


  angle += spin;


  fallingGif.style.transform =
    "translate3d("+
    x+"px,"+
    y+"px,0) rotate("+
    angle+"deg)";


  requestAnimationFrame(
    moveGif
  );

}


/* ==================================================
   START GIF
   ================================================== */

showNextGif();

setInterval(
  showNextGif,
  2000
);

requestAnimationFrame(
  moveGif
);

/* ==================================================
   OPEN PAGE
   ================================================== */

function openPage(pageName){

  const page =
    pages[pageName];

  if(!page){

    return;

  }


  content.innerHTML =
    "<h2>"+
    page.title+
    "</h2>"+

    "<div class='sub'>"+
    page.sub+
    "</div>"+

    page.html;


  modal.classList.add("show");


  gifRunning = false;


  /* ==================================================
     APP SONG AND VIDEO CONTROL
     ================================================== */

  const mediaItems =
    content.querySelectorAll(
      "audio, video"
    );


  mediaItems.forEach(function(mediaItem){

    mediaItem.addEventListener(
      "play",
      function(){

        backgroundResumeAllowed = true;

        /* Pause background music while app media plays. */

        pauseBackgroundMusic();


        /* Pause other songs/videos. */

        mediaItems.forEach(function(otherMedia){

          if(otherMedia !== mediaItem){

            otherMedia.pause();

          }

        });

      }
    );


    function handleMediaStopped(){

      setTimeout(function(){

        if(!isAppMediaPlaying()){

          resumeBackgroundMusic();

        }

      },0);

    }


    mediaItem.addEventListener(
      "pause",
      handleMediaStopped
    );

    mediaItem.addEventListener(
      "ended",
      handleMediaStopped
    );

  });


  const songs =
    content.querySelectorAll(
      "audio"
    );


  songs.forEach(song=>{

    song.addEventListener(
      "play",
      function(){

        songs.forEach(other=>{

          if(other !== song){

            other.pause();

          }

        });

      }
    );

  });


  const memories =
    content.querySelectorAll(
      ".memory"
    );


  memories.forEach(memory=>{

    memory.addEventListener(
      "click",
      function(){

        large.src =
          memory.dataset.photo;

        viewer.classList.add(
          "show"
        );

      }
    );

  });

}

    content.querySelectorAll("audio, video").forEach(
      function(mediaItem){

        mediaItem.pause();

      }
    );


    /* Allow background music to resume automatically. */

    backgroundResumeAllowed = true;

    bg.pause();


    modal.classList.remove(
      "show"
    );

    gifRunning = true;


    /* Resume background music after closing the app. */

    setTimeout(function(){

      resumeBackgroundMusic();

    },0);

  }
);

/* ==================================================

   ================================================== */

bg.muted = true;

bg.play().catch(
  function(){}
);


/* ==================================================
   MUTE BUTTON
   ================================================== */

mute.addEventListener(
  "click",
  function(event){

    event.stopPropagation();

    bg.muted =
      !bg.muted;

    muted =
      bg.muted;

    mute.textContent =
      muted
      ? "🔇"
      : "🔊";


    if(!muted){

      /* Manually enabling music allows it to play again. */

      backgroundResumeAllowed = true;


      if(!isAppMediaPlaying()){

        bg.play().catch(
          function(){}
        );

      }


      /* Hide first-open message */

      musicHint.classList.add(
        "hide"
      );

      setTimeout(
        function(){

          musicHint.style.display =
            "none";

        },
        400
      );

    }

  }
);


/* ==================================================
   START MUSIC AFTER INTERACTION
   ================================================== */

document.addEventListener(
  "pointerdown",
  function(){

    if(
      !muted &&
      backgroundResumeAllowed &&
      !isAppMediaPlaying()
    ){

      bg.play().catch(
        function(){}
      );

    }

  },
  {once:true}
);


/* ==================================================
   I MISS YOU TOUCH EFFECT
   ================================================== */

let lastTouch = 0;


phone.addEventListener(
  "pointerdown",
  function(event){

    if(
      event.target.closest(
        "#muteBtn"
      ) ||

      event.target.closest(
        "audio"
      ) ||

      event.target.closest(
        "video"
      ) ||

      event.target.closest(
        ".app"
      ) ||

      event.target.closest(
        ".modal"
      )
    ){

      return;

    }


    const now =
      Date.now();


    if(
      now-lastTouch < 350
    ){

      return;

    }


    lastTouch = now;


    const message =
      document.createElement(
        "div"
      );


    message.className =
      "miss";


    message.textContent =
      "I miss you ♡";


    message.style.left =
      event.clientX+"px";


    message.style.top =
      event.clientY+"px";


    document.body.appendChild(
      message
    );


    setTimeout(
      function(){

        message.remove();

      },
      1400
    );


    if(
      !muted &&
      backgroundResumeAllowed &&
      !isAppMediaPlaying()
    ){

      bg.play().catch(
        function(){}
      );

    }

  });


/* ==================================================
   RESIZE
   ================================================== */

window.addEventListener(
  "resize",
  function(){

    const size =
      getGifSize();


    const maxX =
      Math.max(
        0,
        phone.clientWidth-size
      );


    const maxY =
      Math.max(
        0,
        phone.clientHeight-size
      );


    if(x > maxX){

      x = maxX;

    }


    if(y > maxY){

      y = maxY;

    }

  }
);


})();
