<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>For Vaishnavi ♡</title>

<style>
*{
  box-sizing:border-box
}

html,body{
  margin:0;
  min-height:100%;
  font-family:system-ui,sans-serif
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:12px;
  background:#151015
}

.phone{
  width:min(440px,100%);
  min-height:680px;
  position:relative;
  overflow:hidden;
  border-radius:32px;
  color:#fff;

  background:
    linear-gradient(180deg,#0003,#000b),
    url("images/background.jpg") center/cover no-repeat;

  box-shadow:0 20px 70px #0007
}


/* =========================
   GIF LAYER
========================= */

#gifLayer{
  position:absolute;
  inset:0;

  z-index:1;

  pointer-events:none !important;

  overflow:hidden;
}

.falling-gif{
  position:absolute;

  width:64px;
  height:64px;

  object-fit:contain;

  pointer-events:none !important;
  user-select:none;

  z-index:1;

  filter:drop-shadow(0 5px 10px #0008);

  will-change:left,top,transform;

  opacity:0;

  transition:opacity .15s ease;
}


/* =========================
   CONTENT
========================= */

.content{
  position:relative;

  z-index:2;

  padding:24px 18px 18px;

  min-height:680px;

  pointer-events:auto;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start
}

.hello{
  font-size:12px;
  opacity:.8
}

.name{
  font-size:25px;
  font-weight:800
}

.mute{
  border:1px solid #ffffff4d;
  background:#0004;
  color:#fff;
  border-radius:50%;
  width:44px;
  height:44px;
  font-size:18px;
  cursor:pointer
}

.center{
  text-align:center;
  margin:38px 0 30px
}

.center h1{
  font-size:31px;
  margin:0 0 8px;
  text-shadow:0 3px 15px #0008
}

.center p{
  font-size:13px;
  opacity:.85
}

.apps{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px
}


/* =========================
   GLASS APP BUTTONS
========================= */

.app{
  border:1px solid #ffffff38;
  background:#ffffff24;
  color:#fff;

  border-radius:22px;

  padding:15px 7px;

  min-height:106px;

  cursor:pointer;

  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);

  box-shadow:
    0 8px 25px #0004,
    inset 0 1px 1px #ffffff25;

  transition:.18s;

  position:relative;

  z-index:3;
}

.app:hover{
  transform:translateY(-3px);
  background:#ffffff2b
}

.app:active{
  transform:scale(.94);

  filter:blur(2px);

  background:#ffffff40;

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px)
}

.icon{
  font-size:28px;
  margin-bottom:8px
}

.app span{
  font-size:12px;
  font-weight:700
}

.bottom{
  position:absolute;

  left:18px;
  right:18px;
  bottom:18px;

  text-align:center;

  font-size:12px;

  opacity:.75
}


/* =========================
   GLASS MODAL
========================= */

.modal{
  position:absolute;

  inset:0;

  background:#00000055;

  backdrop-filter:blur(3px);
  -webkit-backdrop-filter:blur(3px);

  z-index:10;

  display:none;

  align-items:flex-end;

  padding:10px
}

.modal.show{
  display:flex
}


/* =========================
   TRANSPARENT GLASS SHEET
========================= */

.sheet{
  width:100%;

  max-height:88%;

  overflow:auto;

  background:#ffffff20;

  color:#fff;

  border:1px solid #ffffff38;

  border-radius:28px;

  padding:22px;

  backdrop-filter:blur(20px) saturate(130%);
  -webkit-backdrop-filter:blur(20px) saturate(130%);

  box-shadow:
    0 10px 40px #0005,
    inset 0 1px 1px #ffffff35;

  animation:up .25s ease
}

@keyframes up{

  from{
    transform:translateY(35px);
    opacity:0
  }

  to{
    transform:translateY(0);
    opacity:1
  }

}

.close,
.photo-close{
  border:0;

  background:#ffffffcc;

  color:#241c22;

  border-radius:50%;

  width:40px;
  height:40px;

  font-size:20px;

  cursor:pointer
}

.close{
  float:right
}

h2{
  font-size:25px;

  margin:3px 45px 7px 0;

  text-shadow:0 2px 10px #0006
}

.sub{
  color:#ffffffc7;

  font-size:13px
}


/* =========================
   GLASS NOTES
========================= */

.note{
  background:#ffffff18;

  border:1px solid #ffffff25;

  color:#fff;

  border-radius:20px;

  padding:18px;

  margin-top:17px;

  line-height:1.75;

  font-size:15px;

  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);

  box-shadow:inset 0 1px 1px #ffffff20
}


/* =========================
   SONGS
========================= */

.songs{
  display:grid;

  gap:11px;

  margin-top:18px
}

.song{
  background:#00000045;

  border:1px solid #ffffff25;

  color:#fff;

  border-radius:18px;

  padding:15px;

  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);

  box-shadow:inset 0 1px 1px #ffffff15
}

.song strong{
  display:block
}

.song small{
  color:#ffffffb5
}

.song audio{
  width:100%;

  margin-top:10px
}


/* =========================
   MEMORIES
========================= */

.memory-grid{
  display:grid;

  grid-template-columns:repeat(2,1fr);

  gap:10px;

  margin-top:17px
}

.memory{
  border:1px solid #ffffff30;

  padding:0;

  height:150px;

  border-radius:18px;

  overflow:hidden;

  cursor:pointer;

  background:#ffffff18;

  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px)
}

.memory img{
  width:100%;

  height:100%;

  object-fit:cover;

  display:block;

  transition:.2s
}

.memory:hover img{
  transform:scale(1.04)
}


/* =========================
   WISH
========================= */

.wish{
  text-align:center
}

.heart{
  font-size:50px;

  animation:pulse 1.4s infinite
}

@keyframes pulse{

  50%{
    transform:scale(1.12)
  }

}


/* =========================
   PHOTO VIEWER
========================= */

.photo-viewer{
  position:absolute;

  inset:0;

  background:#000eb;

  z-index:20;

  display:none;

  align-items:center;

  justify-content:center;

  padding:18px
}

.photo-viewer.show{
  display:flex
}

.photo-viewer img{
  width:auto;

  height:auto;

  max-width:100%;

  max-height:80%;

  object-fit:contain;

  border-radius:16px
}

.photo-close{
  position:absolute;

  top:18px;

  right:18px;

  background:#fff
}


/* =========================
   I MISS YOU
========================= */

.miss{
  position:fixed;

  transform:translate(-50%,-50%);

  z-index:50;

  pointer-events:none;

  font-weight:800;

  font-size:22px;

  color:#fff;

  text-shadow:0 3px 18px #000;

  animation:miss 1.35s ease forwards
}

@keyframes miss{

  0%{
    opacity:0;

    transform:
      translate(-50%,-50%)
      scale(.8)
  }

  15%{
    opacity:1
  }

  100%{
    opacity:0;

    transform:
      translate(-50%,-100%)
      scale(1.08)
  }

}


/* =========================
   MOBILE
========================= */

@media(max-width:430px){

  .phone,
  .content{
    min-height:650px
  }

  .center{
    margin-top:30px
  }

  .app{
    min-height:96px
  }

  .memory{
    height:125px
  }

  .falling-gif{
    width:60px;
    height:60px
  }

}

</style>
</head>


<body>

<script>

(()=>{


/* =========================
   ELEMENTS
========================= */

const modal =
  document.getElementById("modal");

const content =
  document.getElementById("content");

const phone =
  document.getElementById("phone");

const bg =
  document.getElementById("backgroundMusic");

const mute =
  document.getElementById("muteBtn");

const viewer =
  document.getElementById("photoViewer");

const large =
  document.getElementById("largePhoto");

const fallingGif =
  document.getElementById("fallingGif");


/* =========================
   FALLING GIF SYSTEM
========================= */

const gifList = [

  "images/gif1.gif",
  "images/gif2.gif",
  "images/gif3.gif",
  "images/gif4.gif",
  "images/gif5.gif"

];


let gifIndex = 0;

let gifX = 50;
let gifY = 50;

let velocityX = 2;
let velocityY = 2;

let rotation = 0;

let rotationSpeed = 3;

const gifSize = 64;


/* RANDOM */

function random(min,max){

  return Math.random() * (max-min) + min;

}


/* =========================
   CHANGE GIF
========================= */

function nextGif(){

  fallingGif.style.opacity = "0";


  setTimeout(()=>{


    fallingGif.src =
      gifList[gifIndex];


    gifIndex++;


    if(gifIndex >= gifList.length){

      gifIndex = 0;

    }


    const width =
      phone.clientWidth;

    const height =
      phone.clientHeight;


    const maxX =
      Math.max(0,width-gifSize);

    const maxY =
      Math.max(0,height-gifSize);


    /* RANDOM POSITION */

    gifX =
      random(0,maxX);

    gifY =
      random(0,maxY);


    /* RANDOM DIRECTION */

    velocityX =
      random(-2.5,2.5);

    velocityY =
      random(-2.5,2.5);


    /* PREVENT TOO-SLOW MOVEMENT */

    if(Math.abs(velocityX) < 1){

      velocityX =
        velocityX < 0
        ? -1.5
        : 1.5;

    }


    if(Math.abs(velocityY) < 1){

      velocityY =
        velocityY < 0
        ? -1.5
        : 1.5;

    }


    /* RANDOM ROTATION */

    rotation =
      random(0,360);


    rotationSpeed =
      random(2,5);


    /* CLOCKWISE / ANTICLOCKWISE */

    if(Math.random() < 0.5){

      rotationSpeed *= -1;

    }


    fallingGif.style.opacity =
      "1";


  },150);

}


/* =========================
   GIF ANIMATION
========================= */

function animateGif(){


  const width =
    phone.clientWidth;

  const height =
    phone.clientHeight;


  const maxX =
    Math.max(0,width-gifSize);

  const maxY =
    Math.max(0,height-gifSize);


  /* MOVE */

  gifX += velocityX;

  gifY += velocityY;


  /* LEFT EDGE */

  if(gifX <= 0){

    gifX = 0;

    velocityX =
      Math.abs(velocityX);

  }


  /* RIGHT EDGE */

  if(gifX >= maxX){

    gifX = maxX;

    velocityX =
      -Math.abs(velocityX);

  }


  /* TOP EDGE */

  if(gifY <= 0){

    gifY = 0;

    velocityY =
      Math.abs(velocityY);

  }


  /* BOTTOM EDGE */

  if(gifY >= maxY){

    gifY = maxY;

    velocityY =
      -Math.abs(velocityY);

  }


  /* ROTATE */

  rotation += rotationSpeed;


  /* POSITION */

  fallingGif.style.left =
    gifX + "px";

  fallingGif.style.top =
    gifY + "px";


  fallingGif.style.transform =
    `rotate(${rotation}deg)`;


  requestAnimationFrame(animateGif);

}


/* START GIF */

nextGif();

setInterval(
  nextGif,
  2000
);

animateGif();


/* =========================
   PAGES
========================= */

const pages = {


music:{

title:"Our Songs 🎵",

sub:"Kuch songs aapke liye.",

html:`

<div class="songs">


<div class="song">

<strong>
Song One ♡
</strong>

<small>
By my side 💞
</small>

<audio controls>

<source
  src="music/song1.mp3"
  type="audio/mpeg">

</audio>

</div>


<div class="song">

<strong>
Song Two ♡
</strong>

<small>
First love 💌
</small>

<audio controls>

<source
  src="music/song2.mp3"
  type="audio/mpeg">

</audio>

</div>


<div class="song">

<strong>
Song Three ♡
</strong>

<small>
Behja 😗
</small>

<audio controls>

<source
  src="music/song3.mp3"
  type="audio/mpeg">

</audio>

</div>


</div>

`

},


memories:{

title:"Our Memories 📸",

sub:"Tap any photo to open it.",

html:`

<div class="memory-grid">


<button
  class="memory"
  data-photo="images/photo1.jpg">

<img
  src="images/photo1.jpg"
  alt="Memory 1">

</button>


<button
  class="memory"
  data-photo="images/photo2.jpg">

<img
  src="images/photo2.jpg"
  alt="Memory 2">

</button>


<button
  class="memory"
  data-photo="images/photo3.jpg">

<img
  src="images/photo3.jpg"
  alt="Memory 3">

</button>


<button
  class="memory"
  data-photo="images/photo4.jpg">

<img
  src="images/photo4.jpg"
  alt="Memory 4">

</button>


<button
  class="memory"
  data-photo="images/photo5.jpg">

<img
  src="images/photo5.jpg"
  alt="Memory 5">

</button>


<button
  class="memory"
  data-photo="images/photo6.jpg">

<img
  src="images/photo6.jpg"
  alt="Memory 6">

</button>


</div>


<div class="note">

Itte sare photo h but ye kuch special h😗.

</div>

`

},


notes:{

title:"A Note For You 💌",

sub:"Something I wanted you to have.",

html:`

<div class="note">

You are one of those people who quietly becomes a very important part of someone's life.

<br><br>

Thank you for the laughs, the talks, the little arguments, the random moments and everything in between.

<br><br>

I hope you always remember how genuinely special you are to me. ♡

</div>

`

},


wishes:{

title:"For Your Life 🌷",

sub:"Wishes for everything ahead.",

html:`

<div class="wish">

<div class="heart">
💗
</div>


<div class="note">

I wish you a life full of things that make you smile for real.

<br><br>

I hope you achieve the dreams you are working for, meet kind people, keep your spark and never lose the little things that make you you.

<br><br>

May the years ahead be gentle, exciting and beautiful.

</div>

</div>

`

},


secret:{

title:"Secret Room 🔐",

sub:"You found something.",

html:`

<div
  class="note"
  style="text-align:center">

Okay... this one is just between us. 👀

<br><br>

<b>
I miss you.
</b>

<br><br>

And apparently this website is not helping me hide it.

</div>

`

},


about:{

title:"Why You ✨",

sub:"The part I couldn't fit into one birthday message.",

html:`

<div class="note">

You're important to me in ways that are difficult to put into a single paragraph.

<br><br>

So instead of making one long message, I made you a little world where every app holds a different piece of it. ♡

</div>

`

};


/* =========================
   OPEN APP
========================= */

function openPage(k){

  const p =
    pages[k];


  content.innerHTML =
    "<h2>"+p.title+"</h2>"+
    "<div class='sub'>"+
    p.sub+
    "</div>"+
    p.html;


  modal.classList.add("show");


  /* ONE SONG AT A TIME */

  const songs =
    content.querySelectorAll("audio");


  songs.forEach(song=>{

    song.addEventListener(
      "play",
      ()=>{

        songs.forEach(other=>{

          if(other !== song){

            other.pause();

          }

        });

      }
    );

  });


  /* MEMORY CLICK */

  content
    .querySelectorAll(".memory")
    .forEach(x=>{

      x.addEventListener(
        "click",
        ()=>{

          large.src =
            x.dataset.photo;

          viewer.classList.add(
            "show"
          );

        }
      );

    });

}


/* =========================
   APP BUTTONS
========================= */

document
  .querySelectorAll(".app")
  .forEach(b=>{

    b.addEventListener(
      "click",
      ()=>{

        openPage(
          b.dataset.page
        );

      }
    );

  });


/* =========================
   CLOSE MODAL
========================= */

document
  .getElementById("close")
  .addEventListener(
    "click",
    ()=>{

      modal.classList.remove(
        "show"
      );

    }
  );


modal.addEventListener(
  "click",
  e=>{

    if(e.target === modal){

      modal.classList.remove(
        "show"
      );

    }

  }
);


/* =========================
   PHOTO VIEWER
========================= */

document
  .getElementById("photoClose")
  .addEventListener(
    "click",
    ()=>{

      viewer.classList.remove(
        "show"
      );

      large.src = "";

    }
  );


/* =========================
   BACKGROUND MUSIC
========================= */

bg.muted = true;

bg.play().catch(()=>{});


/* =========================
   MUTE BUTTON
========================= */

let muted = true;


mute.addEventListener(
  "click",
  e=>{

    e.stopPropagation();


    bg.muted =
      !bg.muted;


    muted =
      bg.muted;


    mute.textContent =
      muted
      ? "🔇"
      : "🔊";


    if(!muted){

      bg.play().catch(()=>{});

    }

  }
);


/* =========================
   START MUSIC AFTER INTERACTION
========================= */

document.addEventListener(
  "pointerdown",
  ()=>{

    if(!muted){

      bg.play().catch(()=>{});

    }

  },
  {once:true}
);


/* =========================
   I MISS YOU TOUCH EFFECT
========================= */

let last = 0;


phone.addEventListener(
  "pointerdown",
  e=>{


    if(
      e.target.closest("#muteBtn") ||
      e.target.closest("audio") ||
      e.target.closest(".app") ||
      e.target.closest(".modal")
    ){

      return;

    }


    let now =
      Date.now();


    if(now-last < 350){

      return;

    }


    last = now;


    let m =
      document.createElement("div");


    m.className =
      "miss";


    m.textContent =
      "I miss you ♡";


    /* EXACT TOUCH POSITION */

    m.style.left =
      e.clientX+"px";

    m.style.top =
      e.clientY+"px";


    document.body.appendChild(m);


    setTimeout(
      ()=>m.remove(),
      1400
    );


    if(muted === false){

      bg.play().catch(()=>{});

    }

  }
);


})();

</script>
